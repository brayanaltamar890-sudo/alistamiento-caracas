    <!-- Script Supabase & Carrusel Corregido -->
    <script>
        // Configuración de Supabase
        const SUPABASE_URL = 'https://hjvftsxciwmnbfqgkhpi.supabase.co';
        // Usamos la clave pública por defecto o la instancia global creada
        const _supabase = window.supabase ? window.supabase.createClient(SUPABASE_URL, 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhqdmZ0c3hjaXdtbmJmcWdraHBpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3MDk4NDgwMDAsImV4cCI6MjAyNTQyNDAwMH0.placeholder') : null;

        let isLoginMode = false;

        // Lógica para cambiar entre Registro e Inicio de Sesión
        function toggleAuthMode(e) {
            if (e) e.preventDefault();
            isLoginMode = !isLoginMode;

            const title = document.getElementById('form-title');
            const subtitle = document.getElementById('form-subtitle');
            const submitBtn = document.getElementById('btn-submit');
            const toggleText = document.getElementById('toggle-text');
            const toggleLink = document.getElementById('toggle-link');

            const groupCedula = document.getElementById('group-cedula');
            const groupName = document.getElementById('group-name');
            const groupPhone = document.getElementById('group-phone');

            if (isLoginMode) {
                title.textContent = "Iniciar Sesión";
                subtitle.textContent = "Ingresa tus credenciales registradas.";
                submitBtn.textContent = "Ingresar";
                toggleText.textContent = "¿No tienes una cuenta?";
                toggleLink.textContent = "Regístrate aquí";

                groupCedula.style.display = "none";
                groupName.style.display = "none";
                groupPhone.style.display = "none";
            } else {
                title.textContent = "Registro de Alistados";
                subtitle.textContent = "Ingresa tus datos para completar tu solicitud.";
                submitBtn.textContent = "Registrarse";
                toggleText.textContent = "¿Ya te has registrado?";
                toggleLink.textContent = "Iniciar Sesión";

                groupCedula.style.display = "block";
                groupName.style.display = "block";
                groupPhone.style.display = "block";
            }
        }

        // Manejo del envío del formulario
        document.getElementById('auth-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            if (isLoginMode) {
                const { data, error } = await _supabase.auth.signInWithPassword({ email, password });
                if (error) {
                    showAlert("Error al iniciar sesión: " + error.message, "error");
                } else {
                    showAlert("¡Sesión iniciada correctamente!", "success");
                }
            } else {
                const cedula = document.getElementById('cedula').value;
                const fullname = document.getElementById('fullname').value;
                const phone = document.getElementById('phone').value;

                const { data, error } = await _supabase.auth.signUp({
                    email,
                    password,
                    options: {
                        data: { cedula, fullname, phone }
                    }
                });

                if (error) {
                    showAlert("Error en el registro: " + error.message, "error");
                } else {
                    showAlert("¡Registro completado exitosamente!", "success");
                }
            }
        });

        function showAlert(message, type) {
            const alertBox = document.getElementById('alert-box');
            alertBox.textContent = message;
            alertBox.className = `alert alert-${type}`;
            alertBox.style.display = 'block';
        }

        // Lógica del Carrusel de Imágenes
        let currentSlide = 0;
        function rotateSlides() {
            const slides = document.querySelectorAll('.carousel-slide');
            if (slides.length === 0) return;

            slides.forEach(slide => slide.classList.remove('active'));
            currentSlide = (currentSlide + 1) % slides.length;
            slides[currentSlide].classList.add('active');
        }

        setInterval(rotateSlides, 3500);
    </script>
